name: Atualiza medições

# Lê a última medição de cada açude do painel na fonte (coletor/config.py, FONTE) e publica docs/dados/painel.json
# quando o conteúdo muda. Disparo principal: cron-job.org de hora em hora, por POST em
# /repos/dlpena/painel-marcos-regulatorios/actions/workflows/atualiza.yml/dispatches (o schedule do Actions pode atrasar
# mais de 1 hora em repositório gratuito; até o cron-job.org ser configurado, depois da transferência, é ele que roda,
# de hora em hora; depois fica como rede de segurança: rodada a mais não grava nada se o dado não mudou).
on:
  workflow_dispatch:
  schedule:
    - cron: '20 * * * *'

concurrency:
  group: dados
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  atualiza:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # e-mail dos avisos (coletor/email_aviso.py); sem os secrets, o envio é pulado
      AVISO_SMTP_HOST: ${{ secrets.AVISO_SMTP_HOST }}
      AVISO_SMTP_PORTA: ${{ secrets.AVISO_SMTP_PORTA }}
      AVISO_SMTP_USUARIO: ${{ secrets.AVISO_SMTP_USUARIO }}
      AVISO_SMTP_SENHA: ${{ secrets.AVISO_SMTP_SENHA }}
      AVISO_PARA: ${{ secrets.AVISO_PARA }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Medições do SAR
        run: python -m coletor.atualiza

      - name: Publicar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dados/painel.json
          if git diff --cached --quiet; then echo "sem mudança"; exit 0; fi
          git commit -m "dados: medições do SAR $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M') BRT"
          git pull --rebase
          git push

      - name: Abrir issue se falhou
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="Falha na atualização das medições"
          CC=$(python -c "from coletor import config; print(config.citacao())" 2>/dev/null || true)
          RODADA="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # só na primeira falha (sem issue aberta), para não mandar um e-mail por hora enquanto a falha durar
          if [ -z "$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number')" ]; then
            URL=$(gh issue create --title "$T" --body "A rodada $RODADA falhou. O painel continua com os últimos dados publicados. $CC")
            python3 -m coletor.email_aviso --assunto "[Painel alocação] $T" --texto "A rodada $RODADA falhou. O painel continua com os últimos dados publicados." --link "$URL"
          fi

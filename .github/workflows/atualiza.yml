name: Atualiza medições

# Lê a última medição de cada açude do painel na fonte (coletor/config.py, FONTE) e publica docs/dados/painel.json
# quando o conteúdo muda. Disparo principal: cron-job.org de hora em hora, no minuto 20, por POST em
# /repos/anagovbr/painel-marcos-regulatorios/actions/workflows/atualiza.yml/dispatches (README, "Disparo"). O schedule
# abaixo é só reserva: no repositório da ANA ele rodou 3 de 94 horários em 08-09/10/2026 (a cada 4 a 7 horas). Fica em
# minuto diferente do cron-job.org para não rodar em dobro; rodada a mais não grava nada se o dado não mudou.
#
# Publica a página direto pelo Actions (Pages com origem "GitHub Actions") a cada rodada, com a hora desta leitura no
# painel.json; o commit no main, que guarda o histórico, só acontece quando o conteúdo muda. O push de código na página,
# no coletor ou no cadastro também roda este workflow, para publicar a mudança na hora.
on:
  workflow_dispatch:
  schedule:
    - cron: '50 * * * *'
  push:
    branches: [main]
    paths: ['docs/**', 'coletor/**', 'cadastro/**', 'requirements.txt', '.github/workflows/atualiza.yml']

concurrency:
  group: dados
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  atualiza:
    runs-on: ubuntu-latest
    # O GitHub manda e-mail de "rodada falhou" para quem disparou a rodada, que é o dono do token do cron-job.org (da TI).
    # Com isto a rodada com erro não conta como falha para o GitHub; o aviso para quem mantém o painel continua sendo a
    # issue aberta pelo passo "Abrir issue se falhou", que cita AVISAR (coletor/config.py).
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.publica1.outputs.page_url || steps.publica2.outputs.page_url }}
    timeout-minutes: 20
    env:
      # e-mail dos avisos (coletor/email_aviso.py); sem os secrets, o envio é pulado
      AVISO_SMTP_HOST: ${{ secrets.AVISO_SMTP_HOST }}
      AVISO_SMTP_PORTA: ${{ secrets.AVISO_SMTP_PORTA }}
      AVISO_SMTP_USUARIO: ${{ secrets.AVISO_SMTP_USUARIO }}
      AVISO_SMTP_SENHA: ${{ secrets.AVISO_SMTP_SENHA }}
      AVISO_PARA: ${{ secrets.AVISO_PARA }}
    steps:
      # o main de agora, e não o do momento em que a rodada entrou na fila (sem isso, a rodada que esperou a outra
      # terminar partia de uma versão velha e o commit dava conflito: 23/10/2026)
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Medições do SAR
        id: medicoes
        run: python -m coletor.atualiza

      - name: Guardar no Git se o conteúdo mudou
        if: steps.medicoes.outputs.mudou == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dados/painel.json
          git commit -m "dados: medições do SAR $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M') BRT"
          git pull --rebase --autostash
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # a publicação do Pages falha de vez em quando do lado do GitHub (15 e 23/10/2026, erro 500); tenta de novo depois
      # de 1 minuto e, se falhar outra vez, não derruba a rodada: a seguinte publica. Página parada por mais de 3 horas é
      # o que vira issue (coletor/confere_pagina.py, no vigia).
      - name: Publicar a página
        id: publica1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Esperar antes de tentar de novo
        if: steps.publica1.outcome == 'failure'
        run: sleep 60

      - name: Publicar a página (segunda tentativa)
        id: publica2
        if: steps.publica1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Fechar a issue de falha, se o robô voltou a funcionar
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="Falha na atualização das medições"
          RODADA="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for n in $(gh issue list --state open --search "$T in:title" --json number,title --jq ".[] | select(.title == \"$T\") | .number"); do
            gh issue close "$n" --comment "Voltou a funcionar na rodada $RODADA."
          done

      - name: Abrir issue se falhou
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="Falha na atualização das medições"
          CC=$(python -c "from coletor import config; print(config.citacao())" 2>/dev/null || true)
          RODADA="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # só na primeira falha (sem issue aberta), para não mandar um e-mail por hora enquanto a falha durar
          if [ -z "$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number')" ]; then
            URL=$(gh issue create --title "$T" --body "A rodada $RODADA falhou. O painel continua com os últimos dados publicados. $CC")
            python3 -m coletor.email_aviso --assunto "[Painel alocação] $T" --texto "A rodada $RODADA falhou. O painel continua com os últimos dados publicados." --link "$URL"
          fi

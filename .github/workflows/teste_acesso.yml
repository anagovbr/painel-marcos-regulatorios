name: Teste de acesso às fontes

# Confere se o runner do GitHub alcança a API do SAR e a página da COMAR (etapa 0 do plano).
on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: API do SAR (última data do SIN)
        run: curl -sS -m 60 -w "\nHTTP %{http_code} em %{time_total}s\n" "https://www.ana.gov.br/sar/restportal/api/retornaUltimaDataMedicaoSIN"
      - name: API do SAR (medições da Paraíba)
        run: |
          D=$(TZ=America/Sao_Paulo LC_ALL=C date +"%a %b %d %Y 00:00:00 GMT-0300")
          curl -sS -m 90 -G -o pb.json -w "HTTP %{http_code} em %{time_total}s, %{size_download} bytes\n" \
            "https://www.ana.gov.br/sar/restportal/api/retornaMedicoes" \
            --data-urlencode "tipoSistema=1" --data-urlencode "siglaUf=PB" --data-urlencode "data=$D"
          python3 -c "import json;j=json.load(open('pb.json'));print(len(j),'reservatórios');print([x for x in j if x['reservatorio'].startswith('EPIT')])"
      - name: Página da COMAR (listagem da pasta de alocação)
        run: |
          curl -sS -m 120 -A "Mozilla/5.0" -o lista.html -w "HTTP %{http_code} em %{time_total}s, %{size_download} bytes\n" \
            "https://www.gov.br/ana/pt-br/assuntos/regulacao-e-fiscalizacao/alocacao-de-agua-e-marcos-regulatorios/alocacao-de-agua/folder_listing?b_size:int=1000&b_start:int=0"
          grep -o -E 'alocacao-de-agua/[a-z0-9-]+_[0-9]{2}-[0-9]{4}\.pdf' lista.html | sort -u | tail -5

name: Teste do aviso por e-mail

# Rodar à mão (Actions > Teste do aviso por e-mail > Run workflow) depois de cadastrar os secrets AVISO_* e depois da
# transferência para a organização da ANA: manda um e-mail de teste para AVISO_PARA.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # e-mail dos avisos (coletor/email_aviso.py); sem os secrets, o envio é pulado
      AVISO_SMTP_HOST: ${{ secrets.AVISO_SMTP_HOST }}
      AVISO_SMTP_PORTA: ${{ secrets.AVISO_SMTP_PORTA }}
      AVISO_SMTP_USUARIO: ${{ secrets.AVISO_SMTP_USUARIO }}
      AVISO_SMTP_SENHA: ${{ secrets.AVISO_SMTP_SENHA }}
      AVISO_PARA: ${{ secrets.AVISO_PARA }}
    steps:
      - uses: actions/checkout@v4
      - name: Mandar o e-mail de teste
        run: |
          python3 -m coletor.email_aviso --assunto "[Painel alocação] Teste do aviso por e-mail"             --texto "Se este e-mail chegou, os avisos do painel (boletim que não bate com o cadastro, sistema que entra ou sai, falha dos robôs) chegam por e-mail."             --link "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
